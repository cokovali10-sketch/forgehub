[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgehub"
version = "0.1.0"
description = "ForgeHub - knowledge and tool registry for AI agents. Study it, then use the right tool."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cokovali10-sketch" }]
keywords = ["ai", "agent", "tools", "knowledge", "registry", "mcp", "forge", "solar", "matrix"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
search = ["rank-bm25"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/cokovali10-sketch/forgehub"
Repository = "https://github.com/cokovali10-sketch/forgehub"

[project.scripts]
forgehub = "forgehub.cli:main"

[tool.setuptools.packages.find]
include = ["forgehub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
